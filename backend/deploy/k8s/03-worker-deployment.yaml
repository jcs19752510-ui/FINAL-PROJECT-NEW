# unit-30 — Celery AI 워커(STT/LLM/TTS 실행). **replicas=1로 고정하고 그 이상
# 늘리지 않는다** — `app/services/llm_engine.py`의 `--pool=solo` 단일 GPU 프로세스
# 전제(unit-7 실측, VRAM 598MiB→1717MiB) 때문에 파드를 단순히 늘리면 각 파드가
# 독립적으로 llama-server를 기동하려다 GPU 메모리 경합/이중 점유가 발생한다
# (llm_engine.py의 "포트 8091 이중바인드 방지" 로직도 단일 GPU 전제 위에서만
# 의미가 있음). 진짜로 수평 확장하려면 GPU 노드를 파드 수만큼 늘리고
# `nodeSelector`/`resources.limits`로 노드당 파드 1개를 강제해야 한다 — 이는
# ③ 매트릭스가 이미 "인프라 투자 필요"로 명시한 바로 그 비용이다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: mock-interview
spec:
  replicas: 1  # 위 주석 참고 — 임의로 늘리면 안 됨
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
        - name: celery-worker
          image: REPLACE_ME_REGISTRY/mock-interview-backend:REPLACE_ME_TAG
          command:
            - celery
            - -A
            - app.services.celery_app
            - worker
            - --concurrency=1
            - --pool=solo
            - -Q
            - ai_pipeline
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          resources:
            requests: { cpu: "1", memory: "2Gi" }
            limits: { cpu: "2", memory: "4Gi" }
            # GPU 리소스 — 클러스터에 NVIDIA device plugin이 설치되어 있어야
            # 이 리소스 이름이 스케줄링 가능하다(클러스터별 설정 필요, 이 세션이
            # 검증하지 못함).
            # limits:
            #   nvidia.com/gpu: "1"
          volumeMounts:
            - name: media-storage
              mountPath: /app/var/media
            - name: llm-models
              mountPath: /app/var/llm
      # nodeSelector:
      #   accelerator: nvidia-gpu  # GPU 노드풀에만 스케줄링(클러스터별 라벨 확인 필요)
      volumes:
        - name: media-storage
          persistentVolumeClaim:
            claimName: media-pvc
        - name: llm-models
          persistentVolumeClaim:
            claimName: llm-models-pvc  # GGUF 모델 파일(수 GB) — 매 파드 재시작마다 재다운로드 방지
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-pvc
  namespace: mock-interview
spec:
  accessModes: ["ReadWriteMany"]  # API 파드 여러 개 + 워커가 동시에 같은 media를 읽고 쓴다
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-models-pvc
  namespace: mock-interview
spec:
  accessModes: ["ReadWriteOnce"]  # 워커 1개만 접근(위 replicas=1과 정합)
  resources:
    requests:
      storage: 10Gi
