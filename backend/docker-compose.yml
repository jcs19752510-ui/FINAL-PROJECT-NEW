services:
  db:
    # unit-7(REQ-007): 03-system-design.md §2.1/§3.3이 요구하는 pgvector 확장을 쓰려면
    # 순정 postgres:16 이미지에는 확장 파일이 없어(`CREATE EXTENSION vector` 실패
    # 실측 확인) pgvector가 사전 컴파일되어 포함된 공식 이미지로 교체한다. postgres:16과
    # 완전히 동일한 베이스이므로 기존 데이터 볼륨을 그대로 재사용해도 스키마/데이터
    # 손상이 없다(실제로 기존 볼륨 유지한 채 재기동해 확인함, unit-7-note.md §6 참고).
    image: pgvector/pgvector:pg16
    container_name: final-project-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: final_app
      POSTGRES_PASSWORD: final_app_pw
      POSTGRES_DB: final_project
    ports:
      - "5544:5432"
    volumes:
      - final-project-db-data:/var/lib/postgresql/data

  redis:
    # unit-7(REQ-007): 03-system-design.md §1.3/§2.1, DEC-019 — Celery 브로커 +
    # 세션 캐시/대화 컨텍스트 저장소. 로컬 오픈소스, 별도 라이선스 비용 없음(DEC-007).
    image: redis:7-alpine
    container_name: final-project-redis
    restart: unless-stopped
    ports:
      - "6389:6379"

volumes:
  final-project-db-data:
