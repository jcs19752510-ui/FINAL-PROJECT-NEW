# API 게이트웨이(NGINX) — TLS 1.3 종단, 리버스 프록시 (원본 계획서 4.1 Gateway, 2026-10-12).
#
# 전제: NGINX를 백엔드·프런트와 **같은 PC(호스트)** 에서 실행한다(upstream이 127.0.0.1).
# 실행:  nginx -p deploy/nginx -c nginx.conf     (인증서는 deploy/nginx/certs/ 에 둔다, README 참고)
#
# 아래 값은 운영 환경에 맞게 바꿔야 하는 자리표시자다(결정 필요 항목은 README의 "착수 전 결정" 참고):
#   - server_name  interview.example.internal / apply.example.internal
#   - upstream 포트 3001(면접/채용담당자 화면), 3002(지원 화면), 8001(API)
#   - 인증서 파일 certs/server.crt, certs/server.key (자체서명은 시험용, 운영은 사내 CA 인증서)
worker_processes auto;
pid nginx.pid;

events {
    worker_connections 1024;
}

http {
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    access_log logs/access.log;
    error_log logs/error.log warn;

    # WebSocket 업그레이드 헤더 처리
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream interview_web { server 127.0.0.1:3001; }
    upstream apply_web     { server 127.0.0.1:3002; }
    upstream api           { server 127.0.0.1:8001; }

    # TLS 1.3 전용(원본 REQ-N-003 "전송 시 TLS 1.3"). 1.2 이하 클라이언트는 접속할 수 없다.
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HTTP → HTTPS 전환
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # 면접·채용담당자 화면 + API
    server {
        listen 443 ssl;
        server_name interview.example.internal;

        ssl_certificate     certs/server.crt;
        ssl_certificate_key certs/server.key;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;

        # 음성 답변 업로드 상한 25MB(backend MAX_VOICE_UPLOAD_BYTES)보다 조금 크게
        client_max_body_size 26m;

        # 지표 엔드포인트는 외부로 노출하지 않는다(내부 Prometheus가 직접 API 포트로 수집)
        location = /metrics { return 404; }

        location /api/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;   # LLM 처리 지연 여유(LLM 25초 + 큐 대기)
        }

        location /ws/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;  # 면접 세션 동안 WebSocket 유지
        }

        location / {
            proxy_pass http://interview_web;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    # 채용 지원(이력서) 화면 + API
    server {
        listen 443 ssl;
        server_name apply.example.internal;

        ssl_certificate     certs/server.crt;
        ssl_certificate_key certs/server.key;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;

        client_max_body_size 12m;   # 이력서 PDF 상한 10MB(backend MAX_RESUME_UPLOAD_BYTES)보다 조금 크게

        location = /metrics { return 404; }

        location /api/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location / {
            proxy_pass http://apply_web;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
