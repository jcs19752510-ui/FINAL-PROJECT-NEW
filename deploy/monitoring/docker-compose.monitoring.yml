# Prometheus + Grafana (원본 계획서 7.2, 2026-10-12) — 기존 backend/docker-compose.yml과 별도 파일이라 자동으로 뜨지 않는다.
# 실행: docker compose -f deploy/monitoring/docker-compose.monitoring.yml up -d
#   Prometheus http://127.0.0.1:9090 , Grafana http://127.0.0.1:3000 (초기 계정 admin/admin — 첫 로그인 때 바꿀 것)
# 이미지 버전은 작성 시점 기준이며 이 서버에서 실제로 받아 실행해 보지 못했다(도커 데몬 없음).
# 폐쇄망이면 아래 두 이미지를 docs/onprem/설치물반입목록.md 의 Docker 이미지 반입 대상에 추가해야 한다.
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: final-project-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.3.0
    container_name: final-project-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
