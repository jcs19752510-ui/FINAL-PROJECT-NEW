# CI — 자동 검증(빌드·테스트) (원본 계획서 WBS 2.2 "CI/CD 파이프라인: GitHub Actions", 2026-10-12)
#
# 범위: **검증까지만** 한다. 배포(CD)는 이 워크플로에 넣지 않았다 — 이 저장소 규칙상 배포는 사용자의 명시적 승인 없이
# 실행하지 않으며, 배포 대상(서버)도 정해지지 않았다.
#
# 알려진 한계(정직하게):
#  - 이 워크플로는 GitHub 러너에서 한 번도 실행해 보지 못했다. 같은 명령을 이 저장소의 개발 서버(파이썬 3.11)에서 순서대로
#    실행해 통과를 확인했다. 러너의 파이썬 3.13(프로젝트 ruff target)에서 의존성 설치가 되는지는 첫 실행에서 확인해야 한다.
#  - ruff 는 기존 위반 3건(recruiter_resumes.py, resumes.py)이 있어 경고(continue-on-error)로 시작한다. 정리 후 필수로 전환.
#  - 프런트엔드 eslint 는 기존 오류가 있을 수 있어 경고로 시작한다.
name: ci

on:
  push:
    branches: ["main", "PROD_SCH"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: final_app
          POSTGRES_PASSWORD: ci_pw
          POSTGRES_DB: final_project_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U final_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://final_app:ci_pw@localhost:5432/final_project_ci
      JWT_SECRET_KEY: ci-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: 경량 의존성 설치 (무거운 AI 패키지는 테스트에서 스텁 처리)
        run: |
          pip install -r backend/requirements-dev.txt \
            httpx fastapi sqlalchemy "psycopg[binary]" pydantic pydantic-settings \
            langchain-core langchain-openai langgraph numpy "celery[redis]" pgvector alembic \
            "python-jose[cryptography]" "passlib[argon2]" argon2-cffi email-validator python-multipart \
            "uvicorn[standard]" cryptography Pillow prometheus-client
      - name: ruff (기존 위반이 있어 경고로 시작)
        working-directory: backend
        continue-on-error: true
        run: ruff check .
      - name: DB 준비 (pgvector 확장 + 마이그레이션 전체 적용)
        working-directory: backend
        run: |
          PGPASSWORD=ci_pw psql -h localhost -U final_app -d final_project_ci -c "CREATE EXTENSION IF NOT EXISTS vector"
          alembic upgrade head
      - name: 단위 테스트 (DB 불필요)
        working-directory: backend
        run: python -m pytest tests/feature_a tests/onprem -q
      - name: 그래프·RAG·워커 통합 테스트 (DB 필요)
        working-directory: backend
        run: python -m pytest tests/turn_graph -q
      - name: 최종 합격 메일 테스트 (스텁 충돌을 피해 별도 프로세스)
        working-directory: backend
        run: python -m pytest tests/final_decision/test_final_decision_mail.py -q

  tooling:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://final_app:ci_pw@localhost:5432/final_project_ci
      JWT_SECRET_KEY: ci-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: NGINX 설치 (게이트웨이 실제 구동 테스트용)
        run: sudo apt-get update && sudo apt-get install -y nginx-light
      - name: 의존성 설치
        run: pip install pytest locust fastapi "uvicorn[standard]" httpx pyyaml prometheus-client pydantic pydantic-settings
      - name: 온프리미스 도구 테스트 (실제 네트워크 다운로드 테스트는 제외)
        run: python -m pytest scripts/onprem/tests -q -k "not bu19"
      - name: 게이트웨이·모니터링 설정 테스트
        run: python -m pytest deploy/tests -q
      - name: 부하 테스트 스크립트 테스트
        run: python -m pytest loadtest/tests -q

  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, frontend-apply]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - name: 타입 검사
        run: npx tsc --noEmit
      - name: eslint (기존 오류가 있어 경고로 시작)
        continue-on-error: true
        run: npm run lint
      - name: 빌드
        run: npm run build
      - name: 통계 계산 단위 테스트 (frontend 전용)
        if: matrix.app == 'frontend'
        run: node --experimental-strip-types --test lib/reportStats.test.mjs lib/screeningView.test.mjs
